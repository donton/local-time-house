<!doctype html>

<style>
/* Layout: full-bleed 3D viewport; a drafting-sheet control card floats top-left, room detail card bottom-right. */
:root {
  --bg: #e9e6df;          /* page + scene backdrop: warm drafting paper */
  --scene: #e4e1d9;
  --card: rgba(250, 248, 244, 0.94);
  --ink: #1f1c19;
  --muted: #6b645b;
  --rule: #d4cec3;
  --accent: #7a2a2a;      /* burgundy, from the roof */
  --accent-ink: #fbf8f3;
  --chip: #f1ede6;
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a1918; --scene: #1d1c1b; --card: rgba(36, 34, 32, 0.94); --ink: #efe9e1; --muted: #a59d92;
    --rule: #3c3833; --accent: #c7726a; --accent-ink: #1a1514; --chip: #2d2a27; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1a1918; --scene: #1d1c1b; --card: rgba(36, 34, 32, 0.94); --ink: #efe9e1; --muted: #a59d92;
  --rule: #3c3833; --accent: #c7726a; --accent-ink: #1a1514; --chip: #2d2a27; color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); overflow: hidden; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; outline: none; }
#labels { position: fixed; inset: 0; pointer-events: none; }

.card {
  position: fixed; background: var(--card); border: 1px solid var(--rule); border-radius: 6px;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  box-shadow: 0 6px 24px rgba(0,0,0,0.08);
}
#panel {
  top: calc(12px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px));
  width: 272px; max-height: calc(100% - 24px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  overflow: auto; display: flex; flex-direction: column;
}
.titleblock { padding: 14px 10px 12px 16px; border-bottom: 1px solid var(--rule); display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
.tb-text { flex: 1; min-width: 0; display: grid; gap: 2px; }
.collapse { flex: none; width: 32px; height: 32px; display: grid; place-items: center; border: 1px solid var(--rule); border-radius: 4px; background: var(--chip); color: var(--ink); cursor: pointer; padding: 0; }
.collapse svg { transition: transform 0.2s ease; }
.collapse:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#panel.collapsed .collapse svg { transform: rotate(180deg); }
#panel.collapsed #panel-body { display: none; }
#panel.collapsed .titleblock { border-bottom: 0; }
.titleblock h1 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: 0.04em; text-transform: uppercase; text-wrap: balance; }
.titleblock .meta { font-family: var(--font-mono); font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.controls { padding: 12px 16px; display: grid; gap: 14px; }
.row { display: grid; gap: 6px; }
.lbl { font-size: 10.5px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; }
.seg button { font: 500 12.5px var(--font-body); padding: 7px 0; border: 0; background: transparent; color: var(--ink); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.toggles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.tog { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 7px 9px; border: 1px solid var(--rule); border-radius: 4px; cursor: pointer; user-select: none; }
.tog input { accent-color: var(--accent); margin: 0; }
.slider { display: flex; align-items: center; gap: 10px; }
.slider input { flex: 1; accent-color: var(--accent); }
.slider output { font-family: var(--font-mono); font-size: 11px; color: var(--muted); width: 34px; text-align: right; font-variant-numeric: tabular-nums; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.btn { font: 500 12.5px var(--font-body); padding: 8px 10px; border-radius: 4px; border: 1px solid var(--rule); background: var(--chip); color: var(--ink); cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn:focus-visible, .seg button:focus-visible, .tog:focus-within, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#status { font-size: 12px; color: var(--muted); min-height: 1em; }
.hint { font-size: 11.5px; color: var(--muted); padding: 0 16px 12px; }

#info {
  right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: 300px; max-height: 60%; overflow: auto; padding: 14px 16px; display: grid; gap: 10px;
}
#info h2 { margin: 0; font-family: var(--font-display); font-size: 18px; font-weight: 600; letter-spacing: 0.02em; }
#info .dims { font-family: var(--font-mono); font-size: 13px; font-variant-numeric: tabular-nums; }
#info .lvl { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
#info dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 12.5px; }
#info dt { color: var(--muted); }
#info dd { margin: 0; min-width: 0; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; border: 1px solid rgba(0,0,0,0.15); }
#info .note { font-size: 12px; color: var(--muted); border-top: 1px solid var(--rule); padding-top: 8px; }
#info .close { position: absolute; top: 8px; right: 8px; border: 0; background: transparent; color: var(--muted); font-size: 18px; cursor: pointer; line-height: 1; padding: 4px 8px; }

.rlabel { font-family: var(--font-body); text-align: center; pointer-events: none; color: #1f1c19;
  background: rgba(252, 250, 246, 0.86); border: 1px solid rgba(0,0,0,0.08); border-radius: 3px; padding: 2px 6px; white-space: nowrap; }
.rlabel b { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
.rlabel span { display: block; font-family: var(--font-mono); font-size: 10px; color: #5f584f; font-variant-numeric: tabular-nums; }

.hud { left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); padding: 10px 12px;
  display: flex; align-items: center; gap: 10px; max-width: calc(100% - 32px); flex-wrap: wrap; justify-content: center; }
.hud-text { font-size: 12.5px; color: var(--muted); }
#walkpad { display: none; gap: 6px; }
#walkpad button { width: 44px; height: 44px; border-radius: 6px; border: 1px solid var(--rule); background: var(--chip); color: var(--ink); font-size: 16px; touch-action: none; }
@media (pointer: coarse) { #walkpad { display: flex; } .hud-text { display: none; } }
.tour-label { display: grid; text-align: center; min-width: 140px; }
.tour-label b { font-family: var(--font-display); font-weight: 600; font-size: 15px; }
.tour-label span { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
body.walking #panel, body.walking #info { display: none; }
@media (max-width: 640px) {
  #panel { width: auto; right: max(16px, env(safe-area-inset-right, 0px)); max-height: 46%; }
  #panel.collapsed { right: auto; }
  #panel.collapsed .titleblock { padding: 8px 8px 8px 12px; }
  #panel.collapsed h1 { font-size: 15px; }
  #info { left: max(16px, env(safe-area-inset-left, 0px)); width: auto; max-height: 38%; }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
(function () {
  var panel = document.getElementById('panel'), btn = document.getElementById('panel-toggle');
  var saved = null;
  try { saved = localStorage.getItem('lth-panel'); } catch (e) {}
  function set(open) {
    panel.classList.toggle('collapsed', !open);
    btn.setAttribute('aria-expanded', String(open));
    btn.setAttribute('aria-label', open ? 'Hide controls' : 'Show controls');
  }
  set(saved ? saved === 'open' : !window.matchMedia('(max-width: 640px)').matches);
  panel.querySelector('.titleblock').addEventListener('click', function () {
    var open = panel.classList.contains('collapsed');
    set(open);
    try { localStorage.setItem('lth-panel', open ? 'open' : 'closed'); } catch (e) {}
  });
})();
</script>

<section id="info" class="card" hidden aria-live="polite"></section>

  <span class="hud-text">WASD or arrows to walk · drag to look · Shift to hurry · Esc to leave</span>
  <div id="walkpad" aria-label="Walk controls">
    <button type="button" data-k="KeyA" aria-label="Step left">◀</button>
    <button type="button" data-k="KeyW" aria-label="Walk forward">▲</button>
    <button type="button" data-k="KeyS" aria-label="Walk back">▼</button>
    <button type="button" data-k="KeyD" aria-label="Step right">▶</button>
  </div>
  <button id="walk-exit" class="btn" type="button">Exit walk</button>
</div>

<div id="tourbar" class="card hud" hidden>
  <button id="tour-prev" class="btn" type="button" aria-label="Previous stop">◀</button>
  <div class="tour-label"><b id="tour-name">Arrive</b><span id="tour-count">1 / 9</span></div>
  <button id="tour-next" class="btn" type="button" aria-label="Next stop">▶</button>
  <button id="tour-play" class="btn" type="button">Play</button>
  <button id="tour-exit" class="btn" type="button">Exit</button>
</div>

import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
/* =====================================================================
   0. COORDINATES
   All geometry is in FEET. Plan origin = grid 01 (x) / grid A (z).
   x → east, z → south (plan down), y → up. Main floor = 0'-0".
   The model root is scaled to METERS for the viewer and the GLB.
   ===================================================================== */
const FT = 0.3048;

/* =====================================================================
   1. LEVELS — A201 / A301 / A102 / A402.1
   ===================================================================== */
const LV = {
  GRADE: -2.25,        // A201 "GRADE -2'-3""
  SUNKEN: -1.5,        // sunken living, A402.1 (3 risers @ 6")
  MAIN: 0,
  CEIL1: 8.0,          // T.O. ground wall plate
  LOFT: 9.333,         // Level 2 9'-4"
  PLATE: 13.833,       // T.O. loft wall plate 13'-10"
  LOFT_CEIL: 17.333,   // dormer bedroom flat ceiling, 8'-0" above loft (A301 sect. 1)
  WING_TOP: 9.375,     // flat roof parapet, 10'-10½" above sunken level
  RIDGE: 23.833,       // A102 ridge 23'-10"
  RIDGE_Z: 8.535,      // ridge centered on the 17' bar
  ROOF_EDGE_N: -0.62, ROOF_EDGE_S: 17.69,
  DORMER_X: [23.73, 41.67],  // A102: 17'-11" shed dormer, 6'-4" from east edge
  DORMER_JOIN_Z: 12.8, DORMER_JOIN_Y: 19.583,  // 19'-7"
  DORMER_EAVE_Y: 18.42,                         // 18'-5"
  DORMER_WALL_TOP: 17.75,
};
const roofTop = z => LV.RIDGE - Math.abs(z - LV.RIDGE_Z);       // 12/12, top of roofing
const roofUnder = z => roofTop(z) - 1.17;                        // underside; = plate at wall face
const loftWallTop = z => Math.min(LV.LOFT_CEIL, roofUnder(z));   // interior loft partitions

/* Exterior wall bands (F.O. siding → F.O. interior gyp), from the PDF linework */
const EXT = { N: [-0.32, 0.52], S: [16.54, 17.39], W: [-0.34, 0.51], E: [47.56, 48.4] };

/* =====================================================================
   2. PALETTE + MATERIALS
   ===================================================================== */
const C = {
  chalk: 0xEEE7DC, wood: 0xDCC29C, woodStair: 0xC9A777, siding: 0x5B2B20, roof: 0x5E1F26,
  frame: 0x151515, glass: 0xA7C2CC, concrete: 0x9D9991, deck: 0x977552, ground: 0xC4CBB8,
  gravel: 0xB8B2A6, nautical: 0x25415F, biscuit: 0xE6D6B8, brownberry: 0x5C3A2E, chrome: 0xD5D9DC,

function canvasTex(draw, px = 512) {
  const c = document.createElement('canvas'); c.width = c.height = px;
  const g = c.getContext('2d'); draw(g, px);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;

const TEX = {
  // vertical boards, 6" o.c. (texture tile = 4 ft)
  boards: canvasTex((g, s) => {
    g.fillStyle = '#ffffff'; g.fillRect(0, 0, s, s);
    const n = 8, w = s / n;
    for (let i = 0; i < n; i++) { g.fillStyle = `rgba(0,0,0,${0.03 + (i * 37 % 7) / 120})`; g.fillRect(i * w, 0, w, s); }

  }),
  // standing seams ~16" o.c. (tile = 4 ft)
  seams: canvasTex((g, s) => {
    g.fillStyle = '#ffffff'; g.fillRect(0, 0, s, s);
    const n = 3, w = s / n;
    for (let i = 0; i < n; i++) { g.fillStyle = 'rgba(0,0,0,0.35)'; g.fillRect(i * w, 0, 4, s); g.fillStyle = 'rgba(255,255,255,0.5)'; g.fillRect(i * w + 4, 0, 2, s); }

    g.fillStyle = '#ffffff'; g.fillRect(0, 0, s, s);
    const rows = 11, h = s / rows;

    g.fillStyle = '#ffffff'; g.fillRect(0, 0, s, s);
    const n = 4, w = s / n; g.fillStyle = 'rgba(0,0,0,0.22)';
    for (let i = 0; i < n; i++) { g.fillRect(i * w, 0, 3, s); g.fillRect(0, i * w, s, 3); }

  // sealed/polished concrete (tile = 16 ft): tileable cloudy variation at three scales, fine grain,

    let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    g.fillStyle = 'rgb(236,236,236)'; g.fillRect(0, 0, s, s);

      g.globalAlpha = alpha;

    const n = 4, w = s / n;

const MATS = {};
function M(name) {
  if (MATS[name]) return MATS[name];
  const d = MAT_DEFS[name];
  const m = new THREE.MeshStandardMaterial({
    color: d.color, map: d.map || null, roughness: d.rough ?? 0.8, metalness: d.metal ?? 0,
    transparent: d.opacity != null, opacity: d.opacity ?? 1, depthWrite: d.opacity == null,
  });
  m.name = name; m.userData.tile = d.tile || 4;
  return (MATS[name] = m);
}

/* =====================================================================
   3. GEOMETRY HELPERS (all inputs in feet, world-aligned)
   ===================================================================== */
// World-projected UVs so textures keep real-world scale on every face.
function worldUV(geo, tile) {
  const p = geo.attributes.position, n = geo.attributes.normal, uv = geo.attributes.uv;
  for (let i = 0; i < p.count; i++) {
    const ax = Math.abs(n.getX(i)), ay = Math.abs(n.getY(i)), az = Math.abs(n.getZ(i));
    let u, v;
    if (ay >= ax && ay >= az) { u = p.getX(i); v = p.getZ(i); }
    else if (ax >= az) { u = p.getZ(i); v = p.getY(i); }
    else { u = p.getX(i); v = p.getY(i); }
    uv.setXY(i, u / tile, v / tile);
  }
  uv.needsUpdate = true;
}
function addGeo(parent, geo, matName, opts = {}) {
  const m = M(matName);
  worldUV(geo, m.userData.tile);
  const mesh = new THREE.Mesh(geo, m);
  mesh.castShadow = opts.cast ?? !m.transparent;
  mesh.receiveShadow = true;
  if (opts.room) mesh.userData.room = opts.room;
  if (opts.name) mesh.name = opts.name;
  parent.add(mesh);
  return mesh;
}
function box(parent, [x0, x1], [y0, y1], [z0, z1], matName, opts) {
  const g = new THREE.BoxGeometry(Math.abs(x1 - x0), Math.abs(y1 - y0), Math.abs(z1 - z0));
  g.translate((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  return addGeo(parent, g, matName, opts);
}
function cyl(parent, [x, z], [y0, y1], r, matName, opts) {
  const g = new THREE.CylinderGeometry(r, r, y1 - y0, 20);
  g.translate(x, (y0 + y1) / 2, z);
  return addGeo(parent, g, matName, opts);
}
// Extruded polygon in a wall plane. axis 'x': wall runs along x, pts=[x,y], thickness in z.
// axis 'z': wall runs along z, pts=[z,y], thickness in x.
function prism(parent, axis, pts, [w0, w1], matName, opts) {
  const shape = new THREE.Shape(pts.map(([u, y]) => new THREE.Vector2(axis === 'x' ? u : -u, y)));
  const g = new THREE.ExtrudeGeometry(shape, { depth: w1 - w0, bevelEnabled: false });
  if (axis === 'x') g.translate(0, 0, w0); else { g.rotateY(Math.PI / 2); g.translate(w0, 0, 0); }
  return addGeo(parent, g, matName, opts);
}
// Roof slab whose TOP surface runs from (zA,yA) to (zB,yB), spanning x0..x1, perpendicular thickness t.
function slopedSlab(parent, [x0, x1], [zA, yA], [zB, yB], t, matName, opts) {
  const dz = zB - zA, dy = yB - yA, L = Math.hypot(dz, dy);
  let nz = -dy / L, ny = dz / L; if (ny < 0) { nz = -nz; ny = -ny; }
  const g = new THREE.BoxGeometry(x1 - x0, t, L);
  g.rotateX(-Math.atan2(dy, dz));
  g.translate((x0 + x1) / 2, (yA + yB) / 2 - ny * t / 2, (zA + zB) / 2 - nz * t / 2);
  return addGeo(parent, g, matName, opts);
}

/* Wall builder.
   w = { axis, u:[u0,u1], t:[w0,w1], y:[y0,y1], holes:[[u0,u1,y0,y1],...], layers:[{t:[a,b], m, y0?}], top?:fn(u) }
   Splits the wall around rectangular holes; pieces that reach the wall top follow top(u) when given. */
function buildWall(parent, w) {
  const holes = (w.holes || []).filter(h => h[1] > w.u[0] && h[0] < w.u[1] && h[3] > w.y[0] && h[2] < w.y[1]);
  const cuts = new Set([w.u[0], w.u[1]]);
  holes.forEach(h => { cuts.add(Math.max(w.u[0], h[0])); cuts.add(Math.min(w.u[1], h[1])); });
  const us = [...cuts].sort((a, b) => a - b);
  for (let i = 0; i < us.length - 1; i++) {
    const a = us[i], b = us[i + 1]; if (b - a < 1e-3) continue;
    const mid = (a + b) / 2;
    let ranges = [[w.y[0], w.y[1]]];
    holes.filter(h => h[0] <= mid && h[1] >= mid).forEach(h => {
      ranges = ranges.flatMap(([r0, r1]) => {
        if (h[3] <= r0 || h[2] >= r1) return [[r0, r1]];
        const out = []; if (h[2] > r0) out.push([r0, h[2]]); if (h[3] < r1) out.push([h[3], r1]); return out;
      });
    });
    for (const [r0, r1] of ranges) {
      if (r1 - r0 < 1e-3) continue;
      const followTop = w.top && Math.abs(r1 - w.y[1]) < 1e-6;
      for (const L of w.layers) {
        const y0 = Math.max(r0, L.y0 ?? -Infinity); if (r1 - y0 < 1e-3) continue;
        const pts = [[a, y0], [b, y0]];
        if (followTop) {
          const steps = Math.max(1, Math.ceil((b - a) / 0.5));
          for (let s = steps; s >= 0; s--) { const u = a + (b - a) * s / steps; pts.push([u, Math.max(y0 + 0.01, Math.min(r1, w.top(u)))]); }
        } else { pts.push([b, r1], [a, r1]); }
        prism(parent, w.axis, pts, L.t, L.m, { room: w.room });
      }
    }
  }
}
const SIDING_T = 0.25;
// Exterior wall: siding layer on the outside, chalk core inside. out = -1 → outside at t[0].
function extWall(parent, axis, u, t, out, y, holes, opts = {}) {
  const sid = out < 0 ? [t[0], t[0] + SIDING_T] : [t[1] - SIDING_T, t[1]];
  const core = out < 0 ? [t[0] + SIDING_T, t[1]] : [t[0], t[1] - SIDING_T];
  buildWall(parent, { axis, u, t, y, holes, top: opts.top,
    layers: [{ t: sid, m: 'siding', y0: opts.sidingFrom }, { t: core, m: opts.coreMat || 'chalk' }] });
}
function intWall(parent, axis, u, t, y, holes = [], opts = {}) {
  buildWall(parent, { axis, u, t, y, holes, top: opts.top, room: opts.room, layers: [{ t, m: opts.m || 'chalk' }] });
}

/* Glazing (windows, glazed doors, sidelights): black frame + glass, set 0.3' behind the siding face.
   clip=[y0,y1] lets a tall unit be split between the ground and loft groups without a visible seam. */
function glazing(parent, axis, wallT, out, [u0, u1], [y0, y1], { v = [], h = [], clip = [-99, 99], door = false } = {}) {
  const fw = 0.16, depth = 0.28;
  const wOuter = out < 0 ? wallT[0] : wallT[1];
  const wc = wOuter - out * (0.3 + depth / 2);
  const B = (ua, ub, ya, yb, m, d = depth) => {
    ya = Math.max(ya, clip[0]); yb = Math.min(yb, clip[1]); if (yb - ya < 1e-3) return;
    const mesh = axis === 'x' ? box(parent, [ua, ub], [ya, yb], [wc - d / 2, wc + d / 2], m, m === 'glass' ? { cast: false } : undefined)
                        : box(parent, [wc - d / 2, wc + d / 2], [ya, yb], [ua, ub], m, m === 'glass' ? { cast: false } : undefined);
    if (door) mesh.userData.passable = true;          // walk mode can pass through door leaves
    return mesh;
  };
  B(u0, u0 + fw, y0, y1, 'frame'); B(u1 - fw, u1, y0, y1, 'frame');
  B(u0, u1, y0, y0 + fw, 'frame'); B(u0, u1, y1 - fw, y1, 'frame');
  v.forEach(u => B(u - fw / 2, u + fw / 2, y0, y1, 'frame'));
  h.forEach(y => B(u0, u1, y - fw / 2, y + fw / 2, 'frame'));
  B(u0, u1, y0, y1, 'glass', 0.04);
}

/* Interior door leaf. hinge 'a' = low-u jamb, 'b' = high-u jamb. swing = ±1 along the wall's thickness axis.
   face = the wall surface on the swing side. open = degrees (0 = closed). */
function doorLeaf(parent, { axis, u, face, swing, hinge = 'a', y0, h, open = 90, mat = 'door' }) {
  const width = Math.abs(u[1] - u[0]) - 0.05, th = 0.146;
  const hingeU = hinge === 'a' ? u[0] + 0.02 : u[1] - 0.02;
  const dirU = hinge === 'a' ? 1 : -1;
  const pivot = new THREE.Group();
  const geo = new THREE.BoxGeometry(axis === 'x' ? width : th, h, axis === 'x' ? th : width);
  if (axis === 'x') { geo.translate(dirU * width / 2, h / 2, swing * th / 2); pivot.position.set(hingeU, y0, face); pivot.rotation.y = -swing * dirU * THREE.MathUtils.degToRad(open); }
  else { geo.translate(swing * th / 2, h / 2, dirU * width / 2); pivot.position.set(face, y0, hingeU); pivot.rotation.y = swing * dirU * THREE.MathUtils.degToRad(open); }
  const mesh = new THREE.Mesh(geo, M(mat)); mesh.castShadow = mesh.receiveShadow = true;
  pivot.add(mesh); parent.add(pivot);
  return pivot;
}

/* ---------- 5b. Floors (structure + finishes) ---------- */
const roomFloorMeshes = {};
function buildFloors() {
  // One continuous finish floor per level, running through doorways and under partitions, so there are no
  // threshold strips between rooms: concrete downstairs (main floor + sunken living), oak in the loft.
  box(G.ground, [0.51, 47.56], [-1.2, 0], [0.52, 16.54], 'concreteFloor', { cast: false });
  box(G.ground, [2.51, 16.52], [LV.SUNKEN - 0.6, LV.SUNKEN], [16.54, 26.55], 'concreteFloor', { cast: false });
  // loft slab: underside = ground ceiling at 8'-0"; continuous oak on top
  const ly = [LV.CEIL1, LV.LOFT - 0.03], lt = [LV.LOFT - 0.03, LV.LOFT];
  for (const [xs, zs] of [[[14.52, 16.92], [0.52, 10.45]], [[14.52, 24.16], [10.45, 16.54]], [[24.16, 47.56], [0.52, 16.54]]]) {
    box(G.loft, xs, ly, zs, 'ceiling');
    if (xs[0] === 14.52) {                                           // edge facing the kitchen: oak stops under the guard,
      box(G.loft, [14.52, 14.82], lt, zs, 'chalk', { cast: false });   //   the slab edge reads as part of the wall
      box(G.loft, [14.82, xs[1]], lt, zs, 'wood', { cast: false });
    } else box(G.loft, xs, lt, zs, 'wood', { cast: false });
  }
  // Exposed loft slab edges are wall surfaces: face them in the wall color (the slab itself is white ceiling below)
  const ey = [LV.CEIL1, LV.LOFT];
  box(G.loft, [14.5, 14.52], ey, [0.52, 16.54], 'chalk', { cast: false });       // kitchen side (open to below)
  box(G.loft, [16.92, 16.94], ey, [0.52, 10.45], 'chalk', { cast: false });      // stair opening, west edge
  box(G.loft, [16.92, 24.16], ey, [10.43, 10.45], 'chalk', { cast: false });     // stair opening, south edge
  // Per-room floors: rooms that share the continuous finish sit flush in it (same material, world-aligned
  // texture, so no seam) and exist for picking; tiled rooms sit 1/8" proud.
  for (const r of ROOMS) {
    const parent = r.floor === 'loft' ? G.loft : G.ground;
    const flush = r.mat === 'concreteFloor' || r.mat === 'wood';
    const top = flush ? r.y : r.y + 0.01;
    roomFloorMeshes[r.id] = r.rects.map(([x0, x1, z0, z1]) => box(parent, [x0, x1], [top - 0.03, top], [z0, z1], r.mat, { room: r.id, cast: false }));
  }
}

// Bed sized from the mattress: [w, l] in feet, headboard against the wall at zHead, centered on cx.
// Frame = mattress + 2" each side and at the foot; headboard 3" thick, 3'-7" high.
function bedSized(g, cx, zHead, [mw, ml], y, room) {
  const e = 2 / 12, hb = 0.25, x0 = cx - mw / 2, x1 = cx + mw / 2, z0 = zHead + hb, z1 = z0 + ml;
  box(g, [x0 - e, x1 + e], [y, y + 1.1], [zHead, z1 + e], 'millwork', { room });            // platform frame
  box(g, [x0, x1], [y + 1.1, y + 1.85], [z0, z1], 'porcelain', { room });                    // mattress
  box(g, [x0 + 0.05, x1 - 0.05], [y + 1.85, y + 1.95], [z0 + 1.9, z1 - 0.05], 'fabric', { room }); // throw
  box(g, [x0 - e, x1 + e], [y, y + 3.6], [zHead, zHead + hb], 'millwork', { room });        // headboard
}
function bed(g, xs, zs, y, room) {
  box(g, xs, [y, y + 1.1], zs, 'millwork', { room });

/* Kitchen — Reform order US262026216REG (4 Nov 2026), top view + front views A–C, on the A401.1 room.
   Inches → feet from the inside face of the west wall (x) and north wall (z). 192" wall to wall.
   BASIS fronts: Burgundy linoleum on base + wall cabinets, natural oak veneer on the full-height wall and cubby.
   Round natural-oak knobs. 4½" plinth, 30" boxes, 5 mm stainless top at ≈35⅝". Wall cabinets 59¼" → 90", 15⅞" deep. */
// Wall cabinets (30¾" with bottom panel) raised 6" from Reform's 59¼"–90" so their tops sit flush under the 8'-0" ledge.
const DINING_CENTER = [(0.51 + 16.52) / 2, (0.52 + 16.54) / 2];   // room center, plan feet
const KIT = { X0: 0.51, Z0: 0.52, PLINTH: 4.5 / 12, BOX: 34.5 / 12, TOP: 35.625 / 12, UP: [65.25 / 12, 96 / 12], UPD: 15.8125 / 12 };
const kx = inch => KIT.X0 + inch / 12, kz = inch => KIT.Z0 + inch / 12;
function buildKitchen(g) {
  const R = { room: 'kitchen' }, G = 0.006, FT_ = 0.066;   // 1/16" reveal, ¾" front
  // BASIS round handle: a ≈1⅜" Ø finger hole through the front, lined in light natural oak,
  // set 2" in from the edges. Drawn as an oak ring around a light-oak recess, flush with the face.
  const KNOB_R = 0.057, KNOB_IN = 0.17;
  const knob = (p, n) => {
    const at = d => [p[0] + n[0] * d, p[1], p[2] + n[2] * d];
    rod(g, at(-FT_ + 0.004), at(0.002), KNOB_R, 'oak', R);
    rod(g, at(-FT_ + 0.002), at(0.004), KNOB_R - 0.014, 'bore', R);
  };
  // Fronts. f = [u0, u1, y0, y1, handle], handle as Reform lists it from the viewer's side:
  // 'tm' top middle, 'tl'/'tr' top left/right, 'bl'/'br' bottom left/right, null = none.
  // dir = the way the front faces (+1 / −1 along its axis). zFace / xFace = the cabinet's front plane.
  const handleU = (k, u0, u1, leftIsLow) => k[1] === 'm' ? (u0 + u1) / 2
    : ((k[1] === 'l') === leftIsLow ? u0 + KNOB_IN : u1 - KNOB_IN);
  const handleY = (k, y0, y1) => k[0] === 't' ? y1 - KNOB_IN : y0 + KNOB_IN;
  const frontsZ = (zFace, list, mat, dir = +1) => list.forEach(([u0, u1, y0, y1, k]) => {
    const zf = zFace + dir * FT_;
    box(g, [u0 + G, u1 - G], [y0 + G, y1 - G], [Math.min(zFace, zf), Math.max(zFace, zf)], mat, R);
    if (k) knob([handleU(k, u0, u1, dir > 0), handleY(k, y0, y1), zf], [0, 0, dir]);   // facing +z: viewer's left = west (low x)
  });
  const frontsX = (xFace, list, mat, dir = +1) => list.forEach(([u0, u1, y0, y1, k]) => {
    const xf = xFace + dir * FT_;
    box(g, [Math.min(xFace, xf), Math.max(xFace, xf)], [y0 + G, y1 - G], [u0 + G, u1 - G], mat, R);
    if (k) knob([xf, handleY(k, y0, y1), handleU(k, u0, u1, dir < 0)], [dir, 0, 0]);   // facing +x: viewer's left = south (high z)
  });
  const P = KIT.PLINTH, B = KIT.BOX, mid = P + 15 / 12;

  // ---- North run (front view B): corner 47 | drawers 30 | RANGE 30 | drawers 21 | panel 1 = 129"
  const zN = kz(24);
  box(g, [kx(0), kx(129)], [P, B], [KIT.Z0, zN], 'oakCarcass', R);
  box(g, [kx(0), kx(129)], [0, P], [KIT.Z0, zN - 0.17], 'burgundy', R);            // plinth, set back
  box(g, [kx(77), kx(107)], [0, KIT.TOP - 0.02], [KIT.Z0, zN], 'steelTop', R);    // 30" slide-in range, stainless (matches the counters)
  box(g, [kx(78), kx(106)], [1.6, 2.6], [zN + 0.01, zN + 0.03], 'frame', R);        // oven window
  frontsZ(zN, [
    [kx(18.1), kx(39.1), P, B, 'tr'],                                              // corner door W21 (+7⅞" filler)
    [kx(39.1), kx(47), P, B, null],
    [kx(47), kx(77), mid, B, 'tm'], [kx(47), kx(77), P, mid, 'tm'],                // cab 2: 2 × W30 H15
    [kx(107), kx(128), mid, B, 'tm'], [kx(107), kx(128), P, mid, 'tm'],            // cab 3: 2 × W21 H15
    [kx(128), kx(129), P, B, null],                                                 // panel 4
  ], 'burgundy');
  // ---- West run (front view C, from the corner): filler 1⅛ | SINK 30 | DW 24 | drawers 24 | panel 1
  const xW = kx(24);
  box(g, [KIT.X0, xW], [P, B], [zN, kz(106.1)], 'oakCarcass', R);
  box(g, [KIT.X0, xW - 0.17], [0, P], [zN, kz(106.1)], 'burgundy', R);
  frontsX(xW, [
    [kz(26), kz(27.1), P, B, null],
    [kz(27.1), kz(57.1), mid, B, 'tm'], [kz(27.1), kz(57.1), P, mid, 'tm'],        // sink base W30
    [kz(57.1), kz(81.1), P, B, 'tm'],                                               // DW panel W24 H30
    [kz(81.1), kz(105.1), mid, B, 'tm'], [kz(81.1), kz(105.1), P, mid, 'tm'],      // cab 10 W24
    [kz(105.1), kz(106.1), P, B, null],                                             // end panel 9
  ], 'burgundy');
  box(g, [KIT.X0, xW + FT_], [0, B], [kz(106.1), kz(106.9)], 'burgundy', R);       // side panel, scribed

  // ---- 5 mm stainless countertops, 1" past the fronts; integral sink under W07
  box(g, [KIT.X0, kx(77)], [B, KIT.TOP], [KIT.Z0, zN + 0.15], 'steelTop', R);
  box(g, [kx(107), kx(129) + 0.02], [B, KIT.TOP], [KIT.Z0, zN + 0.15], 'steelTop', R);
  box(g, [kx(77), kx(107)], [KIT.TOP - 0.02, KIT.TOP + 0.01], [KIT.Z0 + 0.3, zN], 'frame', R);   // range cooktop

// Horizontal polygon slab: pts = [[x,z],...], extruded from y0 to y1.
function hslab(parent, pts, [y0, y1], matName, opts) {
  const shape = new THREE.Shape(pts.map(([x, z]) => new THREE.Vector2(x, -z)));
  const g = new THREE.ExtrudeGeometry(shape, { depth: y1 - y0, bevelEnabled: false });
  g.rotateX(-Math.PI / 2); g.translate(0, y0, 0);
  return addGeo(parent, g, matName, opts);
}
// Round bar between two points (handrails).
function rod(parent, a, b, r, matName, opts) {
  const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b), d = B.clone().sub(A);
  const g = new THREE.CylinderGeometry(r, r, d.length(), 14);
  g.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.clone().normalize()));
  const m = A.clone().add(B).multiplyScalar(0.5); g.translate(m.x, m.y, m.z);
  return addGeo(parent, g, matName, opts);
}

/* Main stair — A402 enlarged plans + stair sections 01/02.
   14 risers @ ±8": 2 risers up the west side to the 1'-4" landing, one more tread, three winders around the
   north end of the center wall, then 7 treads (≈10⅜") south along the east side; riser 14 lands at the loft. */
const STAIR = { r: LV.LOFT / 14, eastX: [21.07, 24.16], flightZ: [4.4, 10.45], treads: 7, enclosedTo: 7.55 };
function buildStair(g) {
  const R = { room: 'entry' }, r = STAIR.r, T = 0.15;
  const L = G.loft;                                                                  // parts above the loft floor
  const tread = (pts, n, solid) => hslab(g, pts, [solid ? 0 : n * r - T, n * r], 'woodStair', R);
  // West run: 2 risers to the 1'-4" landing, then riser 3 (all solid to the floor)
  tread([[16.96, 7.44], [20.24, 7.44], [20.24, 9.19], [16.96, 9.19]], 1, true);
  tread([[16.96, 4.02], [20.24, 4.02], [20.24, 7.44], [16.96, 7.44]], 2, true);     // landing +1'-4"
  tread([[16.96, 3.52], [20.24, 3.52], [20.24, 4.02], [16.96, 4.02]], 3, true);
  // Winders 4–6 around the north end of the center wall (closed below)
  const c = [20.65, 3.52];
  tread([[16.96, 0.52], c, [16.96, 3.52]], 4, true);
  tread([[16.96, 0.52], [24.16, 0.52], c], 5, true);
  tread([c, [24.16, 0.52], [24.16, 4.4], [21.07, 4.4], [21.07, 3.52]], 6, true);

  // East flight, risers 7–14 (≈10⅜" treads). The flight is a closed, painted mass (A402 sect. 02):
  // full height below its upper end down to z 7.55, then a sloped gyp soffit over the shoe-storage nook.
  const [x0, x1] = STAIR.eastX, [za0, za1] = STAIR.flightZ, d = (za1 - za0) / STAIR.treads;
  const nose = z => 7 * r + (z - za0) * (r / d);                                     // nosing line
  const soffit = z => Math.min(LV.CEIL1, nose(z) - 1.1);
  const zE = STAIR.enclosedTo;
  const prof = [[za0, 0], [zE, 0], [zE, soffit(zE)], [za1, soffit(za1)]];
  for (let k = STAIR.treads - 1; k >= 0; k--) {                                      // stepped top, under the treads
    const za = za0 + k * d, top = (7 + k) * r - T;
    prof.push([za + d, top], [za, top]);
  }
  prof.push([za0, 6 * r]);
  prism(g, 'z', prof, [x0, x1], 'millwork', R);                                      // wood wall panel, like the center wall
  for (let k = 0; k < STAIR.treads; k++) {
    const za = za0 + k * d;
    tread([[x0, za], [x1, za], [x1, za + d], [x0, za + d]], 7 + k, false);
    box(g, [x0 + 0.01, x1 - 0.01], [(6 + k) * r, (7 + k) * r - T], [za - 0.02, za], 'chalk', R);   // painted riser
  }
  // Shoe-storage nook bench, 1'-6", running under the flight and filling the space beside the first step
  box(g, [20.24, x1], [0, 1.5], [STAIR.enclosedTo - 0.02, 9.4], 'millwork', R);

  // Center wall: wood wall panel, full height beside the landing (z 3.53–7.53), then a raking guard on the
  // west side of the flight, top 7'-1" → 12'-1" at the loft, bottom following the soffit. Split at the loft floor.
  const topLine = z => 7.1 + (z - 3.53) * (5.0 / (za1 - 3.53));
  const zCut = 3.53 + (LV.LOFT - 7.1) * ((za1 - 3.53) / 5.0);
  prism(g, 'z', [[3.53, 0], [7.53, 0], [7.53, soffit(7.53)], [za1, LV.CEIL1], [za1, LV.LOFT], [zCut, LV.LOFT], [3.53, topLine(3.53)]],
    [20.24, 21.07], 'millwork', R);
  prism(L, 'z', [[zCut, LV.LOFT], [za1, LV.LOFT], [za1, topLine(za1)]], [20.24, 21.07], 'millwork', { room: 'loft' });

  // Single 1¼" Ø wood handrail on the center wall, flat-bar brackets, 34" above the nosings (A402 detail 1)
  const hx = 21.07 + 0.19 + 0.052, H = 2.83, railY = z => nose(z) + H;
  rod(g, [hx, railY(za0), za0], [hx, railY(10.2), 10.2], 0.052, 'woodStair', R);
  for (const z of [5.0, 7.4, 9.7]) box(g, [21.07, hx], [railY(z) - 0.2, railY(z) - 0.05], [z - 0.02, z + 0.02], 'frame', R);
}

  extWall(g, 'x', [-0.34, LV.DORMER_X[0]], EXT.S, +1, Y, []);

    prism(g, 'z', [[EXT.S[0], LV.PLATE], [EXT.S[1], LV.PLATE], [EXT.S[0], roofUnder(EXT.S[0]) + 0.01]], xs, 'chalk');
  const dormerHoles = [[24.95, 27.95, 11.33, 17.33], [28.98, 36.49, 11.33, 17.33], [37.52, 40.52, 11.33, 17.33]];

// Skylights S01 (A200: 2 × fixed, 5'-0" × 3'-0"), north slope, located from A102: 3'-0" across, 1'-7" → 5'-6" up the slope
const SKYLIGHTS = [[17.25, 20.5], [41.8, 45.05]], SKY_Z = [1.6, 5.5];
// split [a,b] along x around the skylights; returns [[x0,x1,hole?], ...]
function xSegments(a, b) {
  const out = []; let x = a;
  for (const [s0, s1] of SKYLIGHTS) { if (s1 <= a || s0 >= b) continue; if (s0 > x) out.push([x, s0, false]); out.push([Math.max(s0, a), Math.min(s1, b), true]); x = s1; }
  if (x < b) out.push([x, b, false]);
  return out;
}
function buildMainRoof(g) {
  const T = 0.83, N = LV.ROOF_EDGE_N, S = LV.ROOF_EDGE_S, rz = LV.RIDGE_Z, ry = LV.RIDGE;
  const [dx0, dx1] = LV.DORMER_X;
  const atZ = z => roofTop(z);
  // north slope, with openings for the two skylights
  const [zA, zB] = SKY_Z;
  for (const [x0, x1, hole] of xSegments(-0.5, 48.56)) {
    if (!hole) { slopedSlab(g, [x0, x1], [N, atZ(N)], [rz, ry], T, 'roof'); continue; }
    slopedSlab(g, [x0, x1], [N, atZ(N)], [zA, atZ(zA)], T, 'roof');
    slopedSlab(g, [x0, x1], [zB, atZ(zB)], [rz, ry], T, 'roof');
  }
  slopedSlab(g, [-0.5, dx0], [rz, ry], [S, atZ(S)], T, 'roof');                    // south slope, west
  slopedSlab(g, [dx1, 48.56], [rz, ry], [S, atZ(S)], T, 'roof');                   // south slope, east
  slopedSlab(g, [dx0, dx1], [rz, ry], [LV.DORMER_JOIN_Z, LV.DORMER_JOIN_Y], T, 'roof');
  // shed dormer 3/12: 19'-7" at the main roof → 18'-5" at the eave

  // dormer cheeks (siding)
  for (const [a, b] of [[dx0, dx0 + 0.43], [dx1 - 0.43, dx1]]) {
    prism(g, 'z', [[LV.DORMER_JOIN_Z, LV.DORMER_JOIN_Y - 0.6], [17.39, LV.DORMER_EAVE_Y - 0.65], [17.39, atZ(17.39)]], [a, b], 'siding');
  }
  // gable ends (siding outside, chalk inside) above the plate
  const tri = [[EXT.N[0], LV.PLATE], [EXT.S[1], LV.PLATE], [rz, roofUnder(rz) + 0.02]];
  prism(g, 'z', tri, [EXT.W[0], EXT.W[0] + SIDING_T], 'siding');
  // inside face of the gables follows the ceiling exactly (no gap at the rake)
  const triIn = [[EXT.N[1], LV.PLATE], [EXT.S[0], LV.PLATE], [EXT.S[0], roofUnder(EXT.S[0]) + 0.01], [rz, roofUnder(rz) + 0.01], [EXT.N[1], roofUnder(EXT.N[1]) + 0.01]];
  prism(g, 'z', triIn, [EXT.W[0] + SIDING_T, EXT.W[1]], 'chalk');
  prism(g, 'z', tri, [EXT.E[1] - SIDING_T, EXT.E[1]], 'siding');
  prism(g, 'z', triIn, [EXT.E[0], EXT.E[1] - SIDING_T], 'chalk');
  // skylights S01 (×2) on the north slope, black curb + glass
  // skylight units: black curb frame (open in the middle) + glass
  for (const [x0, x1] of SKYLIGHTS) {
    const c = 0.2, up = 0.42, top = z => atZ(z) + up;
    slopedSlab(g, [x0, x0 + c], [zA, top(zA)], [zB, top(zB)], up, 'frame');           // curb sits on the roof
    slopedSlab(g, [x1 - c, x1], [zA, top(zA)], [zB, top(zB)], up, 'frame');
    slopedSlab(g, [x0, x1], [zA, top(zA)], [zA + c, top(zA + c)], up, 'frame');
    slopedSlab(g, [x0, x1], [zB - c, top(zB - c)], [zB, top(zB)], up, 'frame');
    slopedSlab(g, [x0 + c, x1 - c], [zA + c, top(zA + c) - 0.02], [zB - c, top(zB - c) - 0.02], 0.03, 'glass', { cast: false });
  }
  // Interior ceilings (painted GWB, white) on the underside of the roof framing; flat 8'-0" ceiling in the dormer bedroom
  const CT = 0.04, uz = z => roofUnder(z) + 0.005;
  for (const [x0, x1, hole] of xSegments(0.51, 47.56)) {                              // north slope, cut for the skylights
    if (!hole) { slopedSlab(g, [x0, x1], [0.52, uz(0.52)], [rz, uz(rz)], CT, 'ceiling', { cast: false }); continue; }
    slopedSlab(g, [x0, x1], [0.52, uz(0.52)], [zA, uz(zA)], CT, 'ceiling', { cast: false });
    slopedSlab(g, [x0, x1], [zB, uz(zB)], [rz, uz(rz)], CT, 'ceiling', { cast: false });
    // white light-well sides from the ceiling up to the skylight
    // white light-well lining, inside the curb, hiding the roof framing and curb (c = curb width)
    const yA = uz(zA) - 0.06, yB = uz(zB) - 0.06, tA = atZ(zA) + 0.02, tB = atZ(zB) + 0.02;
    for (const [a, b] of [[x0, x0 + 0.05], [x1 - 0.05, x1]])
      prism(g, 'z', [[zA, yA], [zB, yB], [zB, tB], [zA, tA]], [a, b], 'ceiling', { cast: false });
    box(g, [x0, x1], [yA, tA], [zA, zA + 0.62], 'ceiling', { cast: false });               // low end (covers the cut roof edge)
    box(g, [x0, x1], [yB, tB], [zB - 0.05, zB + 0.02], 'ceiling', { cast: false });        // high end
  }
  slopedSlab(g, [0.51, 24.16], [rz, uz(rz)], [16.54, uz(16.54)], CT, 'ceiling', { cast: false });
  slopedSlab(g, [41.4, 47.56], [rz, uz(rz)], [16.54, uz(16.54)], CT, 'ceiling', { cast: false });
  slopedSlab(g, [24.16, 41.4], [rz, uz(rz)], [LV.DORMER_JOIN_Z, uz(LV.DORMER_JOIN_Z)], CT, 'ceiling', { cast: false });
  slopedSlab(g, [24.16, 41.4], [LV.DORMER_JOIN_Z, LV.DORMER_JOIN_Y - 0.6], [16.54, LV.DORMER_WALL_TOP + 0.01], CT, 'ceiling', { cast: false });
  box(g, [24.7, 40.86], [LV.LOFT_CEIL, LV.LOFT_CEIL + 0.04], [5.97, 16.54], 'ceiling', { cast: false });
  // ridge cap
  box(g, [-0.5, 48.56], [ry - 0.05, ry + 0.12], [rz - 0.35, rz + 0.35], 'roof');
  // eave soffits (close the overhang above the wall plate)
  box(g, [-0.5, 48.56], [LV.PLATE - 0.02, LV.PLATE + 0.3], [N, EXT.N[0]], 'soffit');
  box(g, [-0.5, dx0], [LV.PLATE - 0.02, LV.PLATE + 0.3], [EXT.S[1], S], 'soffit');
  box(g, [dx1, 48.56], [LV.PLATE - 0.02, LV.PLATE + 0.3], [EXT.S[1], S], 'soffit');
  box(g, [dx0 - 0.1, dx1 + 0.1], [LV.DORMER_WALL_TOP - 0.02, LV.DORMER_WALL_TOP + 0.25], [EXT.S[1], S + 0.06], 'soffit');
}

const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

function zipStore(files) {
  const parts = [], central = []; let off = 0;
  for (const { name, data } of files) {
    const nm = new TextEncoder().encode(name), crc = crc32(data), n = data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(12, 0x21, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, n, true); lh.setUint32(22, n, true); lh.setUint16(26, nm.length, true);
    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true); cd.setUint16(4, 20, true); cd.setUint16(6, 20, true); cd.setUint16(14, 0x21, true);
    cd.setUint32(16, crc, true); cd.setUint32(20, n, true); cd.setUint32(24, n, true); cd.setUint16(28, nm.length, true); cd.setUint32(42, off, true);
    parts.push(lh, nm, data); central.push(cd, nm); off += 30 + nm.length + n;
  }
  const cdSize = central.reduce((a, p) => a + p.byteLength, 0);
  const eo = new DataView(new ArrayBuffer(22));
  eo.setUint32(0, 0x06054b50, true); eo.setUint16(8, files.length, true); eo.setUint16(10, files.length, true);
  eo.setUint32(12, cdSize, true); eo.setUint32(16, off, true);
  return new Blob([...parts, ...central, eo], { type: 'application/zip' });
}
async function exportGLB() {
  const status = document.getElementById('status');
  status.textContent = 'Building GLB…';
  const saved = { ...state };
  Object.assign(state, { floors: 'both', roof: true, explode: 0, night: false }); applyState();
  const snowWas = snowParts.map(m => m.visible); snowParts.forEach(m => { m.visible = false; });
  labels.forEach(l => { l.visible = false; }); hiGroup.visible = false;
  try {
    const glb = await new GLTFExporter().parseAsync(root, { binary: true, onlyVisible: true });
    const bytes = new Uint8Array(glb);
    const readme = new TextEncoder().encode('Local Time House, Andes NY.\nUnits: meters, Y up. Origin near the center of the house.\nGroups: site, ground, loft, wingRoof, mainRoof.\n');
    const api = window.claude?.use ? await window.claude.use('downloads') : null;
    if (api) {
      await api.save({ filename: 'local-time-house-glb.zip', data: zipStore([{ name: 'local-time-house.glb', data: bytes }, { name: 'README.txt', data: readme }]) });
      status.textContent = 'Saved local-time-house-glb.zip (contains the .glb).';
    } else {
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([bytes], { type: 'model/gltf-binary' }));
      a.download = 'local-time-house.glb'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      status.textContent = 'Downloaded local-time-house.glb.';
    }
  } catch (err) {
    status.textContent = err?.code === 'declined' ? 'Export cancelled.' : `Export failed: ${err?.message || err}`;
  } finally {

    snowParts.forEach((m, i) => { m.visible = snowWas[i]; });
  }
}

/* =====================================================================
   12. SITE + SEASONS — from the owner's site photos (Nov 2026): a cleared dirt pad with a gravel band in mixed
   hardwood woods (maple, oak, birch) with scattered pines; ground rising into the trees behind (north); the drive
   and parking to the west; an open view south to a distant ridgeline. The landscape lives outside the house root,
   so Export GLB stays the building only.
   ===================================================================== */
const LAND = new THREE.Group(); LAND.name = 'landscape';
LAND.scale.setScalar(FT); LAND.position.copy(root.position); scene.add(LAND);
const SEASONS = {
  fall:   { ground: 0x7a6553, clearing: 0x8f7259, leaves: [0xc3702c, 0xa6402c, 0xcf9b38, 0x8d5a33, 0x9a7a3c], bare: 0.5, sky: null },
  winter: { ground: 0xe9edf1, clearing: 0xe2e7ec, leaves: [], bare: 1.0, sky: null },
  summer: { ground: 0x5f6e3e, clearing: 0x8a7258, leaves: [0x4f7a34, 0x5d8a3a, 0x43692c, 0x6a8f45], bare: 0.0, sky: null },
};
let seed = 1234; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const CX = 22, CZ = 14;                                                      // clearing center (plan feet)
// grade: flat pad ±60', rising into the woods (north steepest), falling away to the south view
function terrainY(x, z) {

}
const groundMat = new THREE.MeshStandardMaterial({ color: SEASONS.fall.ground, roughness: 1 });
const clearMat = new THREE.MeshStandardMaterial({ color: SEASONS.fall.clearing, roughness: 1 });
{
  const g = new THREE.PlaneGeometry(1400, 1400, 140, 140); g.rotateX(-Math.PI / 2); g.translate(CX, 0, CZ);
  const pos = g.attributes.position;
  for (let i = 0; i < pos.count; i++) pos.setY(i, terrainY(pos.getX(i), pos.getZ(i)) - 0.06);
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, groundMat); m.receiveShadow = true; m.name = 'terrain'; LAND.add(m);
  // dirt pad + the drive/parking to the west
  const pad = new THREE.Mesh(new THREE.CircleGeometry(58, 48).rotateX(-Math.PI / 2).translate(CX, LV.GRADE - 0.03, CZ), clearMat);
  pad.receiveShadow = true; LAND.add(pad);
  const drive = new THREE.Shape([[-14, 4], [-14, 34], [-70, 52], [-150, 70], [-260, 60], [-262, 44], [-150, 52], [-72, 36], [-40, 20]].map(([x, z]) => new THREE.Vector2(x, -z)));
  const dg = new THREE.ShapeGeometry(drive); dg.rotateX(-Math.PI / 2);
  const dpos = dg.attributes.position;
  for (let i = 0; i < dpos.count; i++) dpos.setY(i, terrainY(dpos.getX(i), dpos.getZ(i)) - 0.0);
  const dm = new THREE.Mesh(dg, clearMat); dm.receiveShadow = true; LAND.add(dm);
}
// woods: instanced trunks + canopies (deciduous) and cones (pines)
const TREES = [];
for (let i = 0; i < 520 && TREES.length < 330; i++) {
  const a = rnd() * Math.PI * 2, r = 62 + Math.pow(rnd(), 0.7) * 300;
  const x = CX + Math.cos(a) * r, z = CZ + Math.sin(a) * r;
  const southView = Math.sin(a) > 0.55 && r < 240;                           // keep the view south open
  const onDrive = x < -10 && z > 15 && z < 80 && x > -270;
  if ((southView && rnd() < 0.85) || onDrive) continue;
  TREES.push({ x, z, y: terrainY(x, z), h: 38 + rnd() * 34, pine: rnd() < 0.12, k: rnd() });
}
const decid = TREES.filter(t => !t.pine), pines = TREES.filter(t => t.pine);
const trunkGeo = new THREE.CylinderGeometry(0.35, 0.6, 1, 6).translate(0, 0.5, 0);
const canopyGeo = new THREE.IcosahedronGeometry(1, 1);
const coneGeo = new THREE.ConeGeometry(1, 1, 8).translate(0, 0.5, 0);
const trunks = new THREE.InstancedMesh(trunkGeo, new THREE.MeshStandardMaterial({ color: 0x6d655c, roughness: 1 }), TREES.length);
const canopies = new THREE.InstancedMesh(canopyGeo, new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.95, flatShading: true }), decid.length);
const twigs = new THREE.InstancedMesh(canopyGeo, new THREE.MeshStandardMaterial({ color: 0x6f6259, roughness: 1, transparent: true, opacity: 0.32, depthWrite: false, flatShading: true }), decid.length);
const cones = new THREE.InstancedMesh(coneGeo, new THREE.MeshStandardMaterial({ color: 0x2f4a2e, roughness: 1, flatShading: true }), pines.length);
const mtx = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = new THREE.Vector3(), ps = new THREE.Vector3();
TREES.forEach((t, i) => {
  const th = t.pine ? t.h * 0.35 : t.h * 0.62;
  mtx.compose(ps.set(t.x, t.y, t.z), q.identity(), sc.set(0.6 + t.k * 0.5, th, 0.6 + t.k * 0.5)); trunks.setMatrixAt(i, mtx);
});
decid.forEach((t, i) => {
  const w = 5.5 + t.k * 6.5;
  mtx.compose(ps.set(t.x, t.y + t.h * 0.74, t.z), q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), t.k * 6), sc.set(w, t.h * 0.26, w));
  canopies.setMatrixAt(i, mtx); twigs.setMatrixAt(i, mtx);
});
pines.forEach((t, i) => {
  mtx.compose(ps.set(t.x, t.y + 3, t.z), q.identity(), sc.set(7 + t.k * 4, t.h * 0.95, 7 + t.k * 4)); cones.setMatrixAt(i, mtx);
});
for (const m of [trunks, canopies, cones]) { m.castShadow = true; m.receiveShadow = true; LAND.add(m); }
LAND.add(twigs);
// distant ridgeline to the south (seen from the dormer in the photos)
{
  const pts = []; for (let i = 0; i <= 60; i++) { const x = -2600 + i * 90; pts.push([x, 120 + 90 * Math.sin(i * 0.37) + 50 * Math.sin(i * 1.13 + 1) + 30 * Math.sin(i * 2.7)]); }
  const shp = new THREE.Shape(); shp.moveTo(pts[0][0], -60); pts.forEach(([x, y]) => shp.lineTo(x, y)); shp.lineTo(pts[pts.length - 1][0], -60);
  const rg = new THREE.ShapeGeometry(shp); rg.translate(0, 0, 0);
  const ridge = new THREE.Mesh(rg, new THREE.MeshBasicMaterial({ color: 0x8796ad, fog: true }));
  ridge.position.set(CX, -40, 2400); ridge.rotation.y = Math.PI; LAND.add(ridge);
}
// snow on the roofs (winter only), in the roof groups so it hides with the roof
const snowParts = [];
{
  const S = 0.32, N = LV.ROOF_EDGE_N, Sx = LV.ROOF_EDGE_S, rz = LV.RIDGE_Z, ry = LV.RIDGE, [dx0, dx1] = LV.DORMER_X, up = 0.3;
  const at = z => roofTop(z) + up;
  const add = m => { m.userData.snow = true; m.visible = false; snowParts.push(m); };
  add(slopedSlab(G.mainRoof, [-0.5, 48.56], [N, at(N)], [rz, ry + up], S, 'snow'));
  add(slopedSlab(G.mainRoof, [-0.5, dx0], [rz, ry + up], [Sx, at(Sx)], S, 'snow'));
  add(slopedSlab(G.mainRoof, [dx1, 48.56], [rz, ry + up], [Sx, at(Sx)], S, 'snow'));
  add(slopedSlab(G.mainRoof, [dx0, dx1], [rz, ry + up], [LV.DORMER_JOIN_Z, LV.DORMER_JOIN_Y + up], S, 'snow'));
  add(slopedSlab(G.mainRoof, [dx0 - 0.1, dx1 + 0.1], [LV.DORMER_JOIN_Z, LV.DORMER_JOIN_Y + 0.35], [Sx + 0.06, LV.DORMER_EAVE_Y + 0.3], S, 'snow'));
  add(box(G.wingRoof, [2.51, 16.52], [LV.WING_TOP - 0.3, LV.WING_TOP + 0.05], [17.39, 26.55], 'snow'));
  add(box(G.wingRoof, [17.37, 23.75], [LV.WING_TOP + 0.02, LV.WING_TOP + 0.3], [17.39, 27.05], 'snow'));
  add(box(G.site, [-8.34, -0.34], [-0.167, 0.05], [-0.32, 17.39], 'snow'));
  add(box(G.site, [17.37, 24.07], [-0.167, 0.05], [17.39, 23.8], 'snow'));
}
const fogColor = new THREE.Color();
scene.fog = new THREE.Fog(0xe4e1d9, 180, 900);
siteReady = true;
function applySeason(name) {
  const S = SEASONS[name];
  groundMat.color.set(S.ground); clearMat.color.set(S.clearing);
  const c = new THREE.Color();
  decid.forEach((t, i) => {
    const bare = t.k < S.bare;
    // hide a canopy by scaling it to zero
    canopies.getMatrixAt(i, mtx); mtx.decompose(ps, q, sc);
    const w = 5.5 + t.k * 6.5;
    sc.set(bare ? 0.0001 : w, bare ? 0.0001 : t.h * 0.26, bare ? 0.0001 : w);
    mtx.compose(ps, q, sc); canopies.setMatrixAt(i, mtx);
    if (S.leaves.length) canopies.setColorAt(i, c.set(S.leaves[Math.floor(t.k * 97) % S.leaves.length]));
    else canopies.setColorAt(i, c.set(0x6f6259));
  });
  canopies.instanceMatrix.needsUpdate = true; if (canopies.instanceColor) canopies.instanceColor.needsUpdate = true;
  cones.material.color.set(name === 'winter' ? 0x3f5546 : 0x2f4a2e);
  snowParts.forEach(m => { m.visible = name === 'winter'; });
}
applySceneTheme();

/* =====================================================================
   13. WALK MODE — first person at 5'-6" eye height. WASD / arrows to move (Shift to hurry), drag to look,
   Esc to leave. Walls, glass and furniture block you; steps up to ~1' are climbed (stairs, the sunken living
   steps, deck steps); you can step down anywhere. The two entry doors let you through.
   ===================================================================== */
const WALK = { on: false, yaw: 0, pitch: -0.05, feet: 0, pos: new THREE.Vector3(), keys: {}, saved: null, drag: null };
const EYE = 5.5 * FT, STEP = 1.05 * FT, RAD = 0.95 * FT;
const toW = (x, y, z) => new THREE.Vector3((x - 24) * FT, y * FT, (z - 13.5) * FT);
let solids = [], grounds = [];
const wrc = new THREE.Raycaster();
function buildColliders() {
  solids = []; grounds = [];
  root.traverse(o => { if (o.isMesh && o.visible && isShown(o) && !o.userData.passable && o.material !== lampMat && o.parent !== hiGroup) solids.push(o); });
  grounds = solids.concat(LAND.children.filter(o => o.isMesh && !o.isInstancedMesh));
}
function castFirst(list, origin, dir, far) {
  wrc.set(origin, dir); wrc.far = far;
  for (const h of wrc.intersectObjects(list, false)) if (h.object.visible) return h;
  return null;
}
const DOWN = new THREE.Vector3(0, -1, 0);
function floorAt(x, z, fromY) { const h = castFirst(grounds, new THREE.Vector3(x, fromY, z), DOWN, 40); return h ? h.point.y : -Infinity; }
function walkStep(dt) {
  const k = WALK.keys, fwd = (k.KeyW || k.ArrowUp ? 1 : 0) - (k.KeyS || k.ArrowDown ? 1 : 0);
  const side = (k.KeyD || k.ArrowRight ? 1 : 0) - (k.KeyA || k.ArrowLeft ? 1 : 0);
  if (k.KeyQ) WALK.yaw += dt * 1.8; if (k.KeyE) WALK.yaw -= dt * 1.8;
  const speed = (k.ShiftLeft || k.ShiftRight ? 10 : 5) * FT;
  const f = new THREE.Vector3(-Math.sin(WALK.yaw), 0, -Math.cos(WALK.yaw)), r = new THREE.Vector3(Math.cos(WALK.yaw), 0, -Math.sin(WALK.yaw));
  const mv = f.multiplyScalar(fwd).add(r.multiplyScalar(side));
  if (mv.lengthSq() > 0) mv.normalize().multiplyScalar(speed * dt);
  for (const axis of ['x', 'z']) {
    const d = mv[axis]; if (Math.abs(d) < 1e-6) continue;
    const dir = new THREE.Vector3(axis === 'x' ? Math.sign(d) : 0, 0, axis === 'z' ? Math.sign(d) : 0);
    let blocked = false;
    for (const hgt of [0.45, 1.2, 1.65]) {
      if (castFirst(solids, new THREE.Vector3(WALK.pos.x, WALK.feet + hgt, WALK.pos.z), dir, RAD + Math.abs(d))) { blocked = true; break; }
    }
    if (blocked) continue;

    WALK.pos.x = nx; WALK.pos.z = nz;
  }

  if (fy !== -Infinity) WALK.feet = fy >= WALK.feet ? fy : WALK.feet + (fy - WALK.feet) * Math.min(1, dt * 10);

}
function enterWalk() {
  if (TOUR.on) exitTour();
  WALK.saved = { state: { ...state }, pos: camera.position.clone(), target: controls.target.clone() };
  Object.assign(state, { floors: 'both', roof: true, explode: 0, labels: false }); applyState(); select(null);
  buildColliders();

  WALK.pos.set(start.x, 0, start.z); WALK.feet = floorAt(start.x, start.z, 1.0); WALK.yaw = 0; WALK.pitch = -0.04;
  WALK.on = true; controls.enabled = false; setFov(FOV.inside);
  document.getElementById('walkhud').hidden = false;
  document.body.classList.add('walking');
}
function exitWalk() {
  if (!WALK.on) return;
  WALK.on = false; WALK.keys = {}; setFov(FOV.orbit);
  document.getElementById('walkhud').hidden = true; document.body.classList.remove('walking');
  Object.assign(state, WALK.saved.state); applyState();
  camera.position.copy(WALK.saved.pos); controls.target.copy(WALK.saved.target); controls.enabled = true; controls.update();
}
addEventListener('keydown', e => {
  if (e.key === 'Escape') { exitWalk(); exitTour(); return; }
  if (!WALK.on) return;
  WALK.keys[e.code] = true;
  if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
});
addEventListener('keyup', e => { WALK.keys[e.code] = false; });
addEventListener('blur', () => { WALK.keys = {}; });
renderer.domElement.addEventListener('pointerdown', e => { if (WALK.on) { WALK.drag = [e.clientX, e.clientY]; renderer.domElement.setPointerCapture?.(e.pointerId); } });
renderer.domElement.addEventListener('pointermove', e => {
  if (!WALK.on || !WALK.drag) return;
  WALK.yaw -= (e.clientX - WALK.drag[0]) * 0.0045; WALK.pitch -= (e.clientY - WALK.drag[1]) * 0.0045;
  WALK.pitch = Math.max(-1.2, Math.min(1.2, WALK.pitch)); WALK.drag = [e.clientX, e.clientY];
});
addEventListener('pointerup', () => { WALK.drag = null; });
document.querySelectorAll('#walkpad [data-k]').forEach(b => {
  const k = b.dataset.k, on = v => e => { e.preventDefault(); WALK.keys[k] = v; };
  b.addEventListener('pointerdown', on(true)); b.addEventListener('pointerup', on(false)); b.addEventListener('pointerleave', on(false)); b.addEventListener('pointercancel', on(false));

document.getElementById('btn-walk').addEventListener('click', enterWalk);
document.getElementById('walk-exit').addEventListener('click', exitWalk);

/* =====================================================================
   14. GUIDED TOUR — saved camera stops with eased fly-throughs. Positions in plan feet (x east, y up, z south).
   ===================================================================== */
const TOUR_STOPS = [
  { name: 'Arrive', pos: [62, 22, 66], look: [22, 6, 14] },
  { name: 'Front porch', pos: [22, 5.4, 36], look: [20, 5.2, 18] },
  { name: 'Entry + stair', inside: true, pos: [21.5, 5.4, 15.8], look: [20.5, 6.0, 3.5] },
  { name: 'Kitchen', inside: true, pos: [14.2, 5.6, 14.6], look: [4.5, 4.0, 2.5] },
  { name: 'Conversation pit', inside: true, pos: [15.0, 4.6, 18.4], look: [6.5, 0.5, 24.5] },
  { name: 'Loft', inside: true, pos: [23.0, 14.6, 15.6], look: [7.0, 7.5, 6.0] },
  { name: 'Primary bedroom', inside: true, pos: [25.6, 14.8, 15.8], look: [38.0, 11.5, 7.5] },
  { name: 'Dollhouse', world: true },
  { name: 'Evening', pos: [70, 20, 70], look: [22, 7, 14], night: true },

const TOUR = { on: false, i: 0, fly: null, play: false, wait: 0, saved: null };
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function tourGo(i) {

  const s = TOUR_STOPS[TOUR.i], world = !!s.world;
  Object.assign(state, { floors: 'both', roof: !world, explode: 0, labels: false, night: !!s.night }); applyState(); select(null);
  const p1 = world ? homePos() : toW(...s.pos), q1 = world ? HOME.target.clone() : toW(...s.look);
  TOUR.fly = { t: 0, dur: 2.4, p0: camera.position.clone(), q0: controls.target.clone(), p1, q1, f0: camera.fov, f1: s.inside ? FOV.inside : FOV.orbit };
  controls.enabled = false; TOUR.wait = 0;
  document.getElementById('tour-name').textContent = s.name;
  document.getElementById('tour-count').textContent = `${TOUR.i + 1} / ${TOUR_STOPS.length}`;
}
function enterTour() {
  if (WALK.on) exitWalk();
  TOUR.saved = { state: { ...state }, pos: camera.position.clone(), target: controls.target.clone() };
  TOUR.on = true; controls.minDistance = 0.3; document.getElementById('tourbar').hidden = false;
  tourGo(0);
}
function exitTour() {
  if (!TOUR.on) return;
  TOUR.on = false; TOUR.fly = null; TOUR.play = false; controls.minDistance = 3; setFov(FOV.orbit);
  document.getElementById('tourbar').hidden = true; document.getElementById('tour-play').textContent = 'Play';
  Object.assign(state, TOUR.saved.state); applyState();
  camera.position.copy(TOUR.saved.pos); controls.target.copy(TOUR.saved.target); controls.enabled = true; controls.update();
}
function tourStep(dt) {
  if (TOUR.fly) {
    const F = TOUR.fly; F.t += dt; const k = ease(Math.min(1, F.t / F.dur));
    camera.position.lerpVectors(F.p0, F.p1, k); controls.target.lerpVectors(F.q0, F.q1, k); camera.lookAt(controls.target);
    setFov(F.f0 + (F.f1 - F.f0) * k);
    if (F.t >= F.dur) { TOUR.fly = null; controls.enabled = true; }
  } else if (TOUR.play) {
    TOUR.wait += dt; if (TOUR.wait > 4.5) tourGo(TOUR.i + 1);
  }
}
document.getElementById('btn-tour').addEventListener('click', enterTour);
document.getElementById('tour-prev').addEventListener('click', () => tourGo(TOUR.i - 1));
document.getElementById('tour-next').addEventListener('click', () => tourGo(TOUR.i + 1));
document.getElementById('tour-play').addEventListener('click', e => { TOUR.play = !TOUR.play; TOUR.wait = 0; e.target.textContent = TOUR.play ? 'Pause' : 'Play'; });
document.getElementById('tour-exit').addEventListener('click', exitTour);

/* =====================================================================
   11. LOOP
   ===================================================================== */
addEventListener('resize', () => {
  if (!window.innerWidth || !window.innerHeight) return;
  camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
  if (!Number.isFinite(camera.position.x)) { camera.position.copy(homePos()); controls.target.copy(HOME.target); }
  renderer.setSize(window.innerWidth, window.innerHeight); labelRenderer.setSize(window.innerWidth, window.innerHeight);
});
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(0.05, clock.getDelta());
  if (WALK.on) walkStep(dt);
  else { if (TOUR.on) tourStep(dt); if (controls.enabled) controls.update(); }
  renderer.render(scene, camera); labelRenderer.render(scene, camera);
});
applyState();
window.__house = { THREE, scene, camera, controls, renderer, state, applyState, ROOMS, select, WALK, TOUR, enterWalk, exitWalk, enterTour, exitTour, tourGo };
